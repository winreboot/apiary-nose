<svg width="700" height="560" viewBox="0 0 700 560" xmlns="http://www.w3.org/2000/svg" role="img">
<title>BME688 to ESP32-S3 wiring</title>
<rect width="700" height="560" fill="#14110c"/>
<style>
 .t{fill:#e9dcc3;font:13px system-ui} .s{fill:#9a8a6a;font:11px system-ui}
 .h{fill:#e8b923;font:600 13px system-ui} .b{fill:none;stroke:#4a4136;stroke-width:1;rx:8}
</style>
<text class="h" x="350" y="30" text-anchor="middle">BME688 &#8594; ESP32-S3 &#183; four wires, two resistors, one capacitor</text>
<rect class="b" x="40" y="60" width="190" height="230" rx="8"/>
<text class="h" x="135" y="84" text-anchor="middle">BME688 module</text>
<text class="s" x="135" y="100" text-anchor="middle">address switch at 0x77</text>
<text class="t" x="218" y="130" text-anchor="end">VCC</text>
<text class="t" x="218" y="164" text-anchor="end">GND</text>
<text class="t" x="218" y="198" text-anchor="end">SCL / SCK</text>
<text class="t" x="218" y="232" text-anchor="end">SDA / MOSI</text>
<text class="s" x="218" y="258" text-anchor="end">MISO</text>
<text class="s" x="218" y="278" text-anchor="end">CS</text>
<rect class="b" x="470" y="60" width="190" height="230" rx="8"/>
<text class="h" x="565" y="84" text-anchor="middle">ESP32-S3 devkit</text>
<text class="t" x="484" y="130">3V3</text>
<text class="t" x="484" y="164">GND</text>
<text class="h" x="484" y="198">GPIO13</text><text class="s" x="552" y="198">SCL</text>
<text class="h" x="484" y="232">GPIO21</text><text class="s" x="552" y="232">SDA</text>
<line x1="226" y1="126" x2="468" y2="126" stroke="#D85A30" stroke-width="2.5"/>
<line x1="226" y1="160" x2="468" y2="160" stroke="#888780" stroke-width="2.5"/>
<line x1="226" y1="194" x2="468" y2="194" stroke="#7A9BFF" stroke-width="2.5"/>
<line x1="226" y1="228" x2="468" y2="228" stroke="#1D9E75" stroke-width="2.5"/>
<text class="s" x="240" y="258">&#8212; leave empty (SPI only)</text>
<text class="s" x="240" y="278">&#8212; leave empty (SPI only)</text>
<line x1="262" y1="126" x2="262" y2="136" stroke="#D85A30" stroke-width="2"/>
<line x1="254" y1="138" x2="270" y2="138" stroke="#e8dcc3" stroke-width="2.5"/>
<path d="M254 148 Q262 143 270 148" stroke="#e8dcc3" stroke-width="2.5" fill="none"/>
<line x1="262" y1="148" x2="262" y2="160" stroke="#888780" stroke-width="2"/>
<text class="s" x="278" y="143">220 &#181;F, long leg to VCC &#8212; only if the cable is long</text>
<rect class="b" x="40" y="320" width="620" height="126" rx="8" stroke-dasharray="5 4"/>
<text class="h" x="350" y="344" text-anchor="middle">Both pull-ups go at the SENSOR end of the cable</text>
<line x1="120" y1="378" x2="160" y2="378" stroke="#1D9E75" stroke-width="2.5"/>
<rect x="160" y="370" width="30" height="16" fill="none" stroke="#e8c07a" stroke-width="1.5"/>
<line x1="190" y1="378" x2="226" y2="378" stroke="#D85A30" stroke-width="2.5"/>
<circle cx="229" cy="378" r="3" fill="#D85A30"/>
<text class="s" x="243" y="382">3.3 V</text>
<text class="t" x="114" y="382" text-anchor="end">SDA</text>
<text class="s" x="175" y="402" text-anchor="middle">2.2 k&#937;</text>
<line x1="400" y1="378" x2="440" y2="378" stroke="#7A9BFF" stroke-width="2.5"/>
<rect x="440" y="370" width="30" height="16" fill="none" stroke="#e8c07a" stroke-width="1.5"/>
<line x1="470" y1="378" x2="506" y2="378" stroke="#D85A30" stroke-width="2.5"/>
<circle cx="509" cy="378" r="3" fill="#D85A30"/>
<text class="s" x="523" y="382">3.3 V</text>
<text class="t" x="394" y="382" text-anchor="end">SCL</text>
<text class="s" x="455" y="402" text-anchor="middle">2.2 k&#937;</text>
<text class="s" x="350" y="428" text-anchor="middle">Many breakouts already have them fitted &#8212; check before adding more.</text>
<line x1="60" y1="482" x2="90" y2="482" stroke="#D85A30" stroke-width="2.5"/><text class="s" x="98" y="486">3.3 V</text>
<line x1="170" y1="482" x2="200" y2="482" stroke="#888780" stroke-width="2.5"/><text class="s" x="208" y="486">GND</text>
<line x1="280" y1="482" x2="310" y2="482" stroke="#1D9E75" stroke-width="2.5"/><text class="s" x="318" y="486">SDA &#8594; GPIO21</text>
<line x1="440" y1="482" x2="470" y2="482" stroke="#7A9BFF" stroke-width="2.5"/><text class="s" x="478" y="486">SCL &#8594; GPIO13</text>
<text class="s" x="350" y="518" text-anchor="middle">The pin marked MOSI is the I&#178;C data line on these boards. Do not touch the metal cap on the sensor &#8212;</text>
<text class="s" x="350" y="536" text-anchor="middle">skin oils contaminate the gas element.</text>
</svg>
